<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link href="style.css" rel="stylesheet" />
		<script src="nui://game/ui/jquery.js" type="text/javascript"></script>
		<title>retro_payphone</title>
	</head>
	<body>
		<div class="Payphone">
			<img
				src="./assets/images/payphone.png"
				alt="payphone"
				class="PayphoneImage"
			/>
			<img src="./assets/images/payphone_arm.png" alt="payphone arm" class="PayphoneArm" />
			<div class="Screen"></div>
			<div class="Numeric">
				<div id="num-1" class="NumericButton"></div>
				<div id="num-2" class="NumericButton"></div>
				<div id="num-3" class="NumericButton"></div>
				<div id="num-4" class="NumericButton"></div>
				<div id="num-5" class="NumericButton"></div>
				<div id="num-6" class="NumericButton"></div>
				<div id="num-7" class="NumericButton"></div>
				<div id="num-8" class="NumericButton"></div>
				<div id="num-9" class="NumericButton"></div>
				<div id="num-*" class="NumericButton"></div>
				<div id="num-0" class="NumericButton"></div>
				<div id="num-#" class="NumericButton"></div>
			</div>
			<div class="CallButton"></div>
			<div class="PayphoneNumber">(953) 555-0100</div>
		</div>
		<script src="main.js"></script>
	</body>
</html>
